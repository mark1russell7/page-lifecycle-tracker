name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests of the website (Vitest browser mode) need Chromium
      - run: pnpm --filter ./packages/site exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      # The npm build of the package, and a check of the files that npm gets
      - run: pnpm --filter page-lifecycle-tracker build
      - run: pnpm --filter page-lifecycle-tracker pack --dry-run
      # The writing rules (ASD-STE100) of the README files and the doc comments
      - run: pnpm lint:ste
