# The CI of page-lifecycle-tracker: the shared CI of mark1russell7 (reusable-ci.yml of
# mark1russell7/template, its CI.md). The job installs Chromium, runs typecheck, test and lint:ste
# (the writing rules, ASD-STE100, of the README files and the doc comments) on Node.js 26, and then
# builds the npm package and checks the files that npm gets.
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@6eea1cec8bcfb62ebe6af7a0d555464c961125c7 # main
    with:
      # Not "build": the job builds only the npm package (the command "run" below)
      scripts: typecheck test lint:ste
      # The browser tests of the website (Vitest browser mode) need Chromium
      setup: pnpm --filter ./packages/site exec playwright install --with-deps chromium
      # The npm build of the package, and a check of the files that npm gets
      run: |
        pnpm --filter page-lifecycle-tracker build
        pnpm --filter page-lifecycle-tracker pack --dry-run
      timeout-minutes: 20
