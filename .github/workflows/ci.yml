# The CI of page-lifecycle-tracker: the shared CI of mark1russell7 (reusable-ci.yml of
# mark1russell7/template, its CI.md). The job installs Chromium, runs typecheck, test and lint:ste
# (the writing rules, ASD-STE100, of the README files and the doc comments) on Node.js 26, and then
# builds the npm package and checks the files that npm gets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@5d70553c6998c5f6f0fed13dc4528f6a207f2f4a # main
    with:
      # Not "build": the job builds only the npm package (the command "run" below)
      scripts: typecheck test lint:ste check:conventions
      # The browser tests of the website (Vitest browser mode) need Chromium
      setup: pnpm --filter ./packages/site exec playwright install --with-deps chromium
      # The npm build of the package, and a check of the files that npm gets
      run: |
        pnpm --filter page-lifecycle-tracker build
        pnpm --filter page-lifecycle-tracker pack --dry-run
      timeout-minutes: 20

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md of the
  # template, "The site config"). The Pages workflow deploys the same site from main.
  site:
    uses: mark1russell7/template/.github/workflows/reusable-pages-check.yml@5d70553c6998c5f6f0fed13dc4528f6a207f2f4a # main
    permissions:
      contents: read

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the
  # ruleset").
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, site]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@5d70553c6998c5f6f0fed13dc4528f6a207f2f4a # main
        with:
          needs: ${{ toJSON(needs) }}
