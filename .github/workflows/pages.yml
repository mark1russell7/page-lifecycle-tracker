# Builds the website (packages/site) and publishes it to GitHub Pages.
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The jobs get only read permissions. The deploy job gets the Pages permissions (below).
permissions:
  contents: read

# One deployment at a time. A newer push cancels a deployment that waits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The build installs and runs the code of the repository, so it gets only read permissions.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build renders each page and each Open Graph image in Chromium
      - name: Install Chromium and its system dependencies
        run: pnpm --filter ./packages/site exec playwright install --with-deps chromium

      - name: Build the site
        run: pnpm --filter ./packages/site build
        env:
          SITE_BASE: ${{ github.event.repository.name }}
          # The absolute URL of the site, for the canonical links, Open Graph and the sitemap
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/site/dist

  # The deploy job runs no code of the repository. Only this job can deploy to Pages.
  deploy:
    needs: build
    # Only when the repository has Pages. The build job above still examines the site.
    if: ${{ github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
