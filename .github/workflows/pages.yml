# Builds the website (packages/site) and publishes it to GitHub Pages, with the shared Pages workflow of
# mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
# A pull request builds and checks the site in a browser, with no deploy.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions: {}

# One deployment at a time. A newer push cancels a deployment that waits.
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The build renders each page and each Open Graph image in Chromium.
      build: |
        pnpm --filter ./packages/site exec playwright install --with-deps chromium
        pnpm --filter ./packages/site build
      out: packages/site/dist
      # SITE_URL gives the absolute URL of the site, for the canonical links, Open Graph and the sitemap.
      env: '{"SITE_BASE": "${{ github.event.repository.name }}", "SITE_URL": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}'
      deploy: ${{ github.event_name != 'pull_request' }}
      # The site-pages action adds the Releases page and the Status page to the built site.
      # The repository has no roadmap file, so the Status page shows the open pull requests and issues.
      site-pages: true
      packages: page-lifecycle-tracker
      site-name: page-lifecycle-tracker
      # The check opens each page in a browser at each width, in light and dark. The probe drives the first page:
      # the simulator, with the real tracker. The check reads the TypeScript source and removes its types.
      site-check: true
      site-check-pages: /docs/concepts/states-and-transitions/,/,/releases/,/status/
      site-check-probe: packages/site/src/check-probe.ts
