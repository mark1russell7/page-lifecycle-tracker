name: Release

# Publishes the package to npm when a version tag (for example v0.2.0) is pushed.
# npm trusted publishing uses the OIDC token of GitHub Actions: the workflow
# needs no npm token, and the package gets a provenance statement. Set up the
# trusted publisher one time on npmjs.com (package settings > Trusted publishing:
# this repository and the workflow release.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/page-lifecycle-tracker
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: The tag agrees with the version of the package
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Trusted publishing needs npm 11.5.1 or later. pnpm publish applies publishConfig (main, types, exports).
      - run: npm install --global npm@latest
      - run: pnpm publish --access public --provenance --no-git-checks
