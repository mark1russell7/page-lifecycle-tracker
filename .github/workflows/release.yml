name: Release

# Publishes the package to npm when a version tag (for example v0.2.0) is pushed.
# npm trusted publishing uses the OIDC token of GitHub Actions: the workflow
# needs no npm token, and the package gets a provenance statement. The trusted
# publisher is set one time: npm trust github page-lifecycle-tracker
# --file release.yml --repo mark1russell7/page-lifecycle-tracker --allow-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/page-lifecycle-tracker
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: The tag agrees with the version of the package
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # pnpm pack runs prepack (the build) and applies publishConfig (main, types, exports)
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      # npm publishes the tarball. Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: npm publish "$RUNNER_TEMP"/page-lifecycle-tracker-*.tgz --access public --provenance
